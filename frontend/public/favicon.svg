<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="swCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="swPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="swSync" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <!-- Clean White Squircle Badge -->
  <rect x="2" y="2" width="28" height="28" rx="7.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Minimal Document Sheet -->
  <rect x="7" y="6" width="18" height="20" rx="3.5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>

  <!-- Text lines -->
  <rect x="10" y="10" width="7" height="1.6" rx="0.8" fill="#cbd5e1"/>
  <rect x="10" y="14" width="11" height="1.6" rx="0.8" fill="#cbd5e1"/>
  <rect x="10" y="18" width="6" height="1.6" rx="0.8" fill="#cbd5e1"/>

  <!-- Dynamic Real-time Sync Arc -->
  <path d="M14 14.5 C 16.5 12, 19 18, 21.5 15.5" stroke="url(#swSync)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Collaborator 1 Cursor (Cyan) -->
  <path d="M12.5 8.5 L12.5 14.5 L14.2 13 L15.7 16 L16.9 15.3 L15.4 12.4 L17 12.4 Z" fill="url(#swCyan)"/>

  <!-- Collaborator 2 Cursor (Purple) -->
